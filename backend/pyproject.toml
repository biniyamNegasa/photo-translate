[project]
name = "photo-translate-backend"
version = "0.1.0"
description = "Local multilingual image text translation backend"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
